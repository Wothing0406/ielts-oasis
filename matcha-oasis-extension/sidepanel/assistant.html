<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mát Cha AI Trợ Lý</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assistant.css">
  <style>
    /* Typing indicator */
    .typing-indicator { display: flex; gap: 5px; align-items: center; padding: 4px 2px; }
    .typing-indicator span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--primary-light); display: inline-block;
      animation: bounce 1.3s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.6; }
      30%            { transform: translateY(-7px); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="panel-container">

    <!-- Header -->
    <div class="panel-header">
      <div class="panel-header-left">
        <div class="panel-avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 2a10 10 0 1 1-3.93 19.19"/>
            <path d="M12 8v4l2 2"/>
          </svg>
        </div>
        <div>
          <h3 class="panel-title">Mát Cha AI</h3>
          <span class="panel-sub">Trợ Lý IELTS Cá Nhân</span>
        </div>
      </div>
      <span id="user-name" class="user-chip">Đang tải...</span>
    </div>

    <!-- Chat Area -->
    <div class="chat-area" id="chat-area">
      <div class="message system">
        <div class="message-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2z"/>
            <path d="M12 8v4l3 3"/>
          </svg>
        </div>
        <div>
          Chào mừng đến với IELTS Oasis! Hỏi tớ bất cứ điều gì về từ vựng, ngữ pháp, hay kỹ năng IELTS nhé.
        </div>
      </div>
    </div>

    <!-- Quick Prompts -->
    <div class="quick-prompts" id="quick-prompts">
      <button class="quick-prompt" data-prompt="Giải thích cách dùng Present Perfect">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="qp-icon">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        Present Perfect
      </button>
      <button class="quick-prompt" data-prompt="Cho tớ 5 từ vựng IELTS band 7+ về chủ đề Environment">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="qp-icon">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        Từ vựng Environment
      </button>
      <button class="quick-prompt" data-prompt="Mẹo viết Introduction cho IELTS Task 2">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="qp-icon">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        Task 2 Intro
      </button>
      <button class="quick-prompt" data-prompt="Phân biệt affect vs effect">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="qp-icon">
          <polyline points="4 7 4 4 20 4 20 7"/>
          <line x1="9" y1="20" x2="15" y2="20"/>
          <line x1="12" y1="4" x2="12" y2="20"/>
        </svg>
        affect vs effect
      </button>
      <button class="quick-prompt" data-prompt="Sửa lỗi ngữ pháp câu tiếng Anh này:">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="qp-icon">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        Kiểm tra ngữ pháp
      </button>
    </div>

    <!-- Input Area -->
    <div class="input-area">
      <textarea id="chat-input" placeholder="Hỏi Mát Cha... (Enter gửi · Shift+Enter xuống dòng)" rows="1"></textarea>
      <button id="btn-send" aria-label="Gửi tin nhắn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>

  </div>
  <script src="assistant.js"></script>
</body>
</html>
