<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assistant.css">
</head>
<body>
  <div class="panel-container">
    <div class="panel-header">
      <h3>Mát Cha AI Trợ Lý 💬</h3>
      <span class="sub-text">Đặt câu hỏi học thuật IELTS tại đây</span>
    </div>
    
    <div class="chat-area" id="chat-area">
      <div class="message system">
        Chào mừng cậu đến với không gian học tập IELTS Oasis! 🍵 Hãy nhập từ vựng cần giải thích hoặc bôi đen từ trên trang web để tớ phân tích nhé.
      </div>
    </div>
    
    <div class="input-area">
      <textarea id="chat-input" placeholder="Hỏi gì tớ đi... (Dùng /define, /rephrase)"></textarea>
      <button id="btn-send">Gửi</button>
    </div>
  </div>
  <script src="assistant.js"></script>
</body>
</html>
