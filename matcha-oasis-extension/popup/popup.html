<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <img src="../assets/icons/icon48.png" alt="Logo" class="logo">
      <h3>Mát Cha AI Eo 🍵</h3>
    </div>
    
    <div id="auth-section" class="section">
      <p class="status-text" id="auth-status-text">Đăng nhập tài khoản IELTS Oasis:</p>
      <form id="popup-login-form" style="display:flex; flex-direction:column; gap:8px;">
        <input type="text" id="popup-username" class="popup-input" placeholder="Tên đăng nhập" required style="padding:10px 12px; border-radius:10px; border:1.5px solid #A7D08C; outline:none; font-size:0.95rem; background:#FFFDF5; color:#5D4037;" />
        <input type="password" id="popup-password" class="popup-input" placeholder="Mật khẩu" required style="padding:10px 12px; border-radius:10px; border:1.5px solid #A7D08C; outline:none; font-size:0.95rem; background:#FFFDF5; color:#5D4037;" />
        <button type="submit" class="btn btn-primary" id="btn-submit-pwd" style="padding:10px; margin-top:2px;">
          Đăng nhập bằng Mật khẩu ➔
        </button>
      </form>
      <div id="popup-login-error" style="color:#D32F2F; font-size:0.85rem; font-weight:bold; text-align:center; display:none;"></div>
      <div style="display:flex; align-items:center; gap:8px; margin:4px 0;">
        <div style="flex:1; height:1px; background:#e0e0e0;"></div>
        <span style="font-size:0.75rem; color:#9e9e9e;">HOẶC</span>
        <div style="flex:1; height:1px; background:#e0e0e0;"></div>
      </div>
      <button class="btn btn-secondary" id="btn-login" style="background:#5865F2; border-color:#4752C4; color:#fff;">
        👾 Đăng nhập Discord OAuth2
      </button>
    </div>

    <div id="main-section" class="section" style="display: none;">
      <div class="user-profile">
        <span class="user-name" id="user-name">Học viên</span>
        <span class="badge" id="study-level">General</span>
      </div>
      
      <div class="stats-card">
        <div class="stat-item">
          <span class="stat-label">Chủ đề:</span>
          <span class="stat-value" id="study-topic">N/A</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Trọng tâm:</span>
          <span class="stat-value" id="study-focus">Toàn diện</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Kho từ vựng:</span>
          <span class="stat-value" id="study-vocab-count" style="color:#2E7D32; font-weight:bold;">0 từ</span>
        </div>
      </div>

      <button class="btn btn-secondary" id="btn-sync-vocab" style="margin-bottom:8px; padding:8px; font-size:0.8rem; background:#F1F8E9; border-color:#A7D08C; color:#2E7D32; cursor:pointer;">
        🔄 Đồng bộ kho từ vựng
      </button>

      <div class="control-group">
        <label class="switch-label">
          <span>Nhắc nhở học tập (30p)</span>
          <input type="checkbox" id="toggle-reminders" checked>
        </label>
      </div>

      <button class="btn btn-secondary" id="btn-open-panel">
        💬 Mở Trợ Lý Matcha AI
      </button>
    </div>

    <!-- Server Settings Section -->
    <div class="section" style="border-top: 1px solid rgba(167, 208, 140, 0.3); margin-top: 8px; padding-top: 8px; font-size: 0.72rem; display: flex; flex-direction: column; gap: 4px;">
      <div style="display:flex; justify-content:space-between; align-items:center; color:#5D4037;">
        <span>Kết nối Máy chủ:</span>
        <span id="current-server-url" style="font-weight:bold; color:#3b7a13; word-break: break-all; max-width: 150px; text-align: right;">...</span>
      </div>
      <button class="btn btn-secondary" id="btn-reset-server" style="width:100%; margin-top:4px; padding:4px; font-size:0.68rem; background: #efebe9; color:#5d4037; border: 1px solid #d7ccc8; cursor: pointer;">
        Kết nối lại Hệ thống chính (ieltsoasis.site) 🔄
      </button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
